<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>记忆馆</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="top">
<div class="user">
<img src="assets/avatar.png">
<div><b>Alex Chen</b><span>Lv.42</span></div>
</div>
<div class="center">📍 杭州 Hangzhou · ☀️ 24°C</div>
<div class="right">🪙12450 💎1280 ⚡120</div>
</header>

<aside class="side">
<button>🌍 世界地图</button>
<button>💼 办公室</button>
<button class="active">🖼️ 记忆馆</button>
<button>💰 财务楼</button>
<button>❤️ 生活区</button>
<button>🤖 AI研究所</button>
</aside>

<main class="main">
<section class="hero">
<img src="assets/scene.jpg">
<div class="panel">
<h2>记忆馆 Lv.7</h2>
<p>5600 / 8000</p>
<div class="bar"><i></i></div>
<p>存放你人生的重要记忆</p>
</div>
</section>

<section class="grid">
<div class="card">
<h3>记忆卡片</h3>
<p>照片 / 音频 / 笔记</p>
</div>
<div class="card">
<h3>时间轴</h3>
<p>按时间浏览</p>
</div>
<div class="card">
<h3>AI 总结</h3>
<p>自动生成回忆</p>
</div>
</section>
</main>

<aside class="right">
<div class="card">
<h3>属性</h3>
<p>存储空间 5.6GB</p>
<p>效率 125%</p>
</div>
<div class="card">
<h3>升级</h3>
<button>升级</button>
</div>
</aside>

</div>
</body>
</html>
